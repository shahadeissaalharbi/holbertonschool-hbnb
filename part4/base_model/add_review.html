<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Review - HBnB</title>
    <link rel="icon" type="image/png" href="images/icon.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav>
            <a href="index.html" class="logo-link">
                <img src="images/logo.png" alt="HBnB logo" class="logo">
            </a>
        </nav>
        <nav>
            <a href="login.html" class="login-button">Login</a>
        </nav>
    </header>

    <main>
        <h1>Reviewing: Beautiful Beach House</h1>

        <section class="add-review" aria-label="Add a review form">
            <h2>Add a Review</h2>
            <form id="review-form" class="form" action="#" method="post">
                <div class="form-group">
                    <label for="review">Your Review</label>
                    <textarea id="review" name="review" placeholder="Share details of your experience..." required></textarea>
                </div>

                <div class="form-group">
                    <label for="rating">Rating</label>
                    <select id="rating" name="rating" required>
                        <option value="" selected disabled>Choose a rating</option>
                        <option value="1">1 Star</option>
                        <option value="2">2 Stars</option>
                        <option value="3">3 Stars</option>
                        <option value="4">4 Stars</option>
                        <option value="5">5 Stars</option>
                    </select>
                </div>

                <button type="submit" class="submit-button">Submit Review</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 HBnB Evolution. All rights reserved.</p>
    </footer>
</body>
</html>
