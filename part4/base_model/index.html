<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Available Places - HBnB</title>
    <link rel="icon" type="image/png" href="images/icon.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav>
            <a href="index.html" class="logo-link">
                <img src="images/logo.png" alt="HBnB logo" class="logo">
            </a>
        </nav>
        <nav>
            <a href="login.html" class="login-button">Login</a>
        </nav>
    </header>

    <main>
        <h1>Available Places</h1>

        <section id="filter" aria-label="Filter places by price">
            <label for="price-filter">Max Price:</label>
            <select id="price-filter" name="price-filter">
                <option value="10">$10</option>
                <option value="50">$50</option>
                <option value="100">$100</option>
                <option value="all" selected>All</option>
            </select>
        </section>

        <section id="places-list" aria-label="List of places">
            <article class="place-card">
                <h2>Beautiful Beach House</h2>
                <p class="place-price">Price per night: $150</p>
                <a href="place.html?id=1" class="details-button">View Details</a>
            </article>

            <article class="place-card">
                <h2>Cozy Cabin</h2>
                <p class="place-price">Price per night: $100</p>
                <a href="place.html?id=2" class="details-button">View Details</a>
            </article>

            <article class="place-card">
                <h2>Modern Apartment</h2>
                <p class="place-price">Price per night: $200</p>
                <a href="place.html?id=3" class="details-button">View Details</a>
            </article>

            <article class="place-card">
                <h2>Lakeside Cottage</h2>
                <p class="place-price">Price per night: $85</p>
                <a href="place.html?id=4" class="details-button">View Details</a>
            </article>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 HBnB Evolution. All rights reserved.</p>
    </footer>
     <script src="scripts.js"></script>
</body>
</html>
